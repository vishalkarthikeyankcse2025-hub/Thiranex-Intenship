<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A responsive e-commerce product catalog built with vanilla JavaScript."
    >

    <title>Shoply - Product Catalog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==============================
         HEADER
         ============================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="/"
                class="logo"
                data-link
            >
                Shoply
            </a>


            <nav class="main-nav">

                <a
                    href="/"
                    data-link
                >
                    Home
                </a>

                <a
                    href="/products"
                    data-link
                >
                    Products
                </a>

                <a
                    href="/cart"
                    data-link
                >
                    Cart
                    <span id="cart-count">0</span>
                </a>

            </nav>

        </div>

    </header>


    <!-- ==============================
         APP ROOT
         ============================== -->

    <main id="app">

        <!-- JavaScript renders pages here -->

    </main>


    <!-- ==============================
         FOOTER
         ============================== -->

    <footer class="site-footer">

        <p>
            © 2026 Shoply. Built with HTML, CSS and JavaScript.
        </p>

    </footer>


    <!-- ==============================
         JAVASCRIPT ENTRY POINT
         ============================== -->

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>

</html>
