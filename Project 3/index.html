<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <!-- Header -->
        <header class="todo-header">
            <h1>To-Do List</h1>
            <p>Keep track of your tasks</p>
        </header>


        <!-- Add Task -->
        <form id="todo-form" class="todo-form">

            <input
                type="text"
                id="todo-input"
                placeholder="What needs to be done?"
                autocomplete="off"
                maxlength="100"
            >

            <button type="submit">
                Add
            </button>

        </form>


        <!-- Filters -->
        <div class="filters">

            <button
                type="button"
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="active"
            >
                Active
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- Task List -->
        <ul id="todo-list" class="todo-list">
            <!-- Tasks are added dynamically -->
        </ul>


        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
            <div class="empty-icon">✓</div>
            <h2>No tasks found</h2>
            <p>Add a task and start getting things done.</p>
        </div>


        <!-- Footer -->
        <div class="todo-footer">

            <p id="todo-count" class="todo-count">
                0 tasks remaining
            </p>

            <button
                type="button"
                id="clear-completed"
                class="clear-completed"
            >
                Clear completed
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
